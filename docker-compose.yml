services:
  # 1. Redis Service (for Caching & BullMQ)
  redis:
    image: redis:7-alpine
    container_name: teamflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 2. MongoDB Service
  mongo:
    image: mongo:7
    container_name: teamflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 3. Backend Service (Express + Socket.io + BullMQ)
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: teamflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    depends_on:
      - mongo
      - redis

  # 4. Frontend Service (Vite + Nginx)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: teamflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
