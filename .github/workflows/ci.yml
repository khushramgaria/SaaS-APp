name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ----------------------------------------------------
  # JOB 1: Frontend Build Verification
  # ----------------------------------------------------
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./Frontend
        run: npm ci

      # Write Frontend Secret to Frontend/.env for Vite build
      - name: Inject Frontend Environment File
        run: |
          echo "${{ secrets.FRONTEND_ENV }}" > ./Frontend/.env

      - name: Build Vite App
        working-directory: ./Frontend
        run: npm run build

  # ----------------------------------------------------
  # JOB 2: Docker Build with GitHub Secrets
  # ----------------------------------------------------
  docker-build:
    name: Build Docker Compose with Secrets
    runs-on: ubuntu-latest
    needs: [frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Write both environment files before compose builds the images
      - name: Inject Backend and Frontend Environment Files
        run: |
          echo "${{ secrets.BACKEND_ENV }}" > ./Backend/.env
          echo "${{ secrets.FRONTEND_ENV }}" > ./Frontend/.env

      - name: Build Docker Compose Images
        run: docker compose build
