name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ----------------------------------------------------
  # JOB 1: Frontend Build Verification
  # ----------------------------------------------------
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Build Vite App
        working-directory: ./Frontend
        env:
          VITE_API_URL: http://localhost:8000/api/v1
          VITE_SOCKET_URL: http://localhost:8000
        run: npm run build

  # ----------------------------------------------------
  # JOB 2: Docker Build with GitHub Secret ENV
  # ----------------------------------------------------
  docker-build:
    name: Build Docker Compose with Secret ENV
    runs-on: ubuntu-latest
    needs: [frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Write GitHub Secret directly into Backend/.env
      - name: Inject Backend Environment File
        run: |
          echo "${{ secrets.BACKEND_ENV }}" > ./Backend/.env

      - name: Build Docker Compose Images
        run: docker compose build